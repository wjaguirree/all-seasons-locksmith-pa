<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 112" fill="none" role="img" aria-label="All Seasons Locksmith emblem">
  <defs>
    <clipPath id="hexClip">
      <path d="M12,56 L40,16 L92,16 L120,56 L92,96 L40,96 Z"/>
    </clipPath>
  </defs>
  <!-- black interior -->
  <path d="M12,56 L40,16 L92,16 L120,56 L92,96 L40,96 Z" fill="#16181a"/>
  <g clip-path="url(#hexClip)">
    <!-- mountains -->
    <path d="M12,74 L34,44 L44,56 L58,34 L74,58 L84,46 L104,72 L120,74 L120,96 L12,96 Z" fill="#e9e9e2"/>
    <path d="M58,34 L64,42 L60,45 L54,42 Z M34,44 L38,50 L34,53 L30,49 Z" fill="#c9cabf"/>
    <!-- snow shadow base tint -->
    <path d="M12,74 L120,74 L120,96 L12,96 Z" fill="#1d2a17"/>
    <!-- pine trees left -->
    <g fill="#3f7d33">
      <path d="M30,86 l6,-16 6,16 z"/><path d="M31,80 l5,-12 5,12 z"/>
      <path d="M42,88 l5,-13 5,13 z"/>
    </g>
    <!-- pine trees right -->
    <g fill="#3f7d33">
      <path d="M96,86 l6,-16 6,16 z"/><path d="M97,80 l5,-12 5,12 z"/>
      <path d="M86,88 l5,-13 5,13 z"/>
    </g>
    <!-- padlock -->
    <g>
      <path d="M56,50 v-5 a10,10 0 0 1 20,0 v5" fill="none" stroke="#f2f2ee" stroke-width="5"/>
      <rect x="50" y="50" width="32" height="30" rx="5" fill="#f2f2ee"/>
      <circle cx="66" cy="62" r="4.5" fill="#16181a"/>
      <path d="M63.5,62 h5 l-1.6,10 h-1.8 z" fill="#16181a"/>
    </g>
  </g>
  <!-- split hexagon border: left green, right orange -->
  <path d="M66,16 L40,16 L12,56 L40,96 L66,96" fill="none" stroke="#5aa349" stroke-width="5" stroke-linejoin="round"/>
  <path d="M66,16 L92,16 L120,56 L92,96 L66,96" fill="none" stroke="#e8792b" stroke-width="5" stroke-linejoin="round"/>
</svg>
